<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wax Seal Mockup V6 - Rosette Ribbon</title>
  <style>
    :root {
      --bg-a: #f4efe8;
      --bg-b: #dccfbe;
      --ink: #2d241a;
      --fabric-a: #a83a4e;
      --fabric-b: #7f1e31;
      --wax-a: #ffd7de;
      --wax-b: #c63c56;
      --wax-c: #7f1122;
      --wax-text: #fff4f6;
      --trim: #f2d8a8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(1300px 760px at 0% 0%, #fff9ee 0%, transparent 58%),
        radial-gradient(1100px 700px at 100% 100%, #ede0cf 0%, transparent 62%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }

    .card {
      width: min(940px, 100%);
      border-radius: 22px;
      border: 1px solid #bda887;
      background: linear-gradient(180deg, rgba(255,255,255,0.76), rgba(255,255,255,0.56));
      box-shadow: 0 16px 32px rgba(54, 37, 18, 0.24), inset 0 1px 0 rgba(255,255,255,0.82);
      padding: 24px;
    }

    h1 {
      margin: 0 0 16px;
      font: 600 28px/1.1 "Iowan Old Style", "Times New Roman", serif;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
    }

    .meta { display: grid; gap: 10px; font-size: 15px; }

    .label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: #7b664f;
      margin-right: 8px;
    }

    .badge {
      position: relative;
      width: 120px;
      height: 142px;
      display: grid;
      justify-items: center;
    }

    .petals {
      width: 120px;
      height: 120px;
      border-radius: 999px;
      background:
        repeating-conic-gradient(
          from 0deg,
          var(--fabric-a) 0deg 9deg,
          var(--fabric-b) 9deg 18deg
        );
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.18), inset 0 -4px 6px rgba(34,8,14,0.56), 0 8px 14px rgba(47, 18, 24, 0.34);
      position: relative;
      z-index: 1;
    }

    .tails {
      position: absolute;
      bottom: 0;
      width: 80px;
      height: 56px;
      z-index: 0;
    }

    .tail {
      position: absolute;
      width: 32px;
      height: 56px;
      background: linear-gradient(180deg, var(--fabric-a), var(--fabric-b));
      border: 1px solid rgba(53, 14, 23, 0.45);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.15), 0 4px 8px rgba(34,12,17,0.25);
      clip-path: polygon(0 0, 100% 0, 100% 78%, 50% 100%, 0 78%);
    }

    .tail.left { left: 6px; transform: rotate(-6deg); }
    .tail.right { right: 6px; transform: rotate(6deg); }

    .wax {
      position: absolute;
      inset: 22px;
      border-radius: 999px;
      border: 1px solid #7f1122;
      background: radial-gradient(circle at 30% 24%, var(--wax-a) 0%, var(--wax-b) 58%, var(--wax-c) 100%);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.28), inset 0 -3px 5px rgba(29,8,13,0.62);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--wax-text);
      text-shadow: 0 1px 1px rgba(31, 8, 13, 0.75);
    }

    .wax::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 999px;
      border: 1px solid rgba(255, 229, 235, 0.34);
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.1) 0deg 8deg, rgba(0,0,0,0.08) 8deg 16deg);
      pointer-events: none;
    }

    .rank-label {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 9px;
      font-weight: 700;
      z-index: 1;
    }

    .rank-num {
      margin: 4px 0 0;
      font: 700 32px/1 "Iowan Old Style", "Times New Roman", serif;
      z-index: 1;
    }

    .ring-dot {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--trim);
      box-shadow: 0 0 0 1px rgba(80, 53, 16, 0.22);
    }

    .dot-1 { top: 8px; left: 56px; }
    .dot-2 { top: 22px; right: 14px; }
    .dot-3 { top: 56px; right: 8px; }
    .dot-4 { bottom: 22px; right: 14px; }
    .dot-5 { bottom: 8px; left: 56px; }
    .dot-6 { bottom: 22px; left: 14px; }
    .dot-7 { top: 56px; left: 8px; }
    .dot-8 { top: 22px; left: 14px; }

    .caption {
      margin-top: 8px;
      text-align: center;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #6f583d;
    }

    .controls {
      margin-top: 16px;
      border-top: 1px dashed #c5b191;
      padding-top: 12px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }

    .controls label { display: flex; align-items: center; gap: 6px; }

    input, select {
      border: 1px solid #c3aa87;
      border-radius: 9px;
      background: #fff7ea;
      color: #2f2518;
      padding: 5px 8px;
      font: inherit;
    }

    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Wax Seal V6: Rosette Ribbon Badge</h1>

    <section class="layout">
      <div class="meta">
        <div><span class="label">Role</span>Military leader</div>
        <div><span class="label">Born</span>356 BCE in Pella <span class="label" style="margin-left:12px;">Died</span>323 BCE</div>
        <div><span class="label">Notable works</span>Conquests across Persia, Hellenistic integration</div>
      </div>

      <div>
        <div class="badge">
          <div class="tails">
            <div class="tail left"></div>
            <div class="tail right"></div>
          </div>
          <div class="petals">
            <div class="ring-dot dot-1"></div>
            <div class="ring-dot dot-2"></div>
            <div class="ring-dot dot-3"></div>
            <div class="ring-dot dot-4"></div>
            <div class="ring-dot dot-5"></div>
            <div class="ring-dot dot-6"></div>
            <div class="ring-dot dot-7"></div>
            <div class="ring-dot dot-8"></div>
            <div class="wax">
              <p id="rankLabel" class="rank-label">Rank</p>
              <p id="rankNum" class="rank-num">#17</p>
            </div>
          </div>
        </div>
        <div class="caption">Merit Rosette</div>
      </div>
    </section>

    <section class="controls">
      <label>Domain
        <select id="domain">
          <option>Science</option>
          <option>Religion</option>
          <option>Philosophy</option>
          <option>Politics</option>
          <option selected>Military</option>
          <option>Arts</option>
          <option>Exploration</option>
          <option>Economics</option>
          <option>Medicine</option>
        </select>
      </label>
      <label>Rank
        <input id="rank" type="number" min="1" max="5000" value="17" />
      </label>
    </section>
  </main>

  <script>
    const palettes = {
      Science: ['#446fba', '#234b88', '#9dc4ff', '#3b6fbe', '#244e91', '#eef5ff', '#d8e5ff'],
      Religion: ['#7b4daa', '#5f3e84', '#d6b4ff', '#8a67be', '#53397b', '#f7efff', '#eadcff'],
      Philosophy: ['#5b70c4', '#3f4e92', '#b7c6ff', '#6a7dd8', '#3c4e90', '#f2f6ff', '#dde7ff'],
      Politics: ['#a83a4e', '#7f1e31', '#ffd7de', '#c63c56', '#7f1122', '#fff4f6', '#f2d8a8'],
      Military: ['#a45d25', '#7a4218', '#ffd8b8', '#cf7831', '#893f16', '#fff6ee', '#f2d8a8'],
      Arts: ['#2a8a6b', '#17664f', '#b6f6de', '#36ad88', '#1b694f', '#effff8', '#d8f3e8'],
      Exploration: ['#2b7f8c', '#1c5f67', '#b8eef7', '#3faabc', '#21656f', '#effcff', '#d7f0f4'],
      Economics: ['#9f712b', '#744f17', '#ffe3b2', '#cf9534', '#825919', '#fff9ef', '#efe2c2'],
      Medicine: ['#9a3b78', '#71295a', '#ffd7ef', '#c95ca0', '#7a2b5f', '#fff4fb', '#efd7e5']
    };

    const root = document.documentElement;
    const rankInput = document.getElementById('rank');
    const domainInput = document.getElementById('domain');
    const rankLabel = document.getElementById('rankLabel');
    const rankNum = document.getElementById('rankNum');

    function setDomain(name) {
      const p = palettes[name] || palettes.Military;
      root.style.setProperty('--fabric-a', p[0]);
      root.style.setProperty('--fabric-b', p[1]);
      root.style.setProperty('--wax-a', p[2]);
      root.style.setProperty('--wax-b', p[3]);
      root.style.setProperty('--wax-c', p[4]);
      root.style.setProperty('--wax-text', p[5]);
      root.style.setProperty('--trim', p[6]);
    }

    function setRank(v) {
      const n = Math.max(1, Math.floor(Number(v) || 1));
      const d = String(n).length;
      rankNum.textContent = `#${n}`;
      rankLabel.style.fontSize = d <= 2 ? '9px' : d === 3 ? '8px' : '7px';
      rankNum.style.fontSize = d <= 2 ? '32px' : d === 3 ? '27px' : '21px';
    }

    domainInput.addEventListener('change', () => setDomain(domainInput.value));
    rankInput.addEventListener('input', () => setRank(rankInput.value));

    setDomain(domainInput.value);
    setRank(rankInput.value);
  </script>
</body>
</html>
