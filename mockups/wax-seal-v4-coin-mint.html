<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wax Seal Mockup V4 - Coin Mint</title>
  <style>
    :root {
      --bg-a: #f2eee6;
      --bg-b: #d8ccb8;
      --ink: #2f261d;
      --metal-light: #f4ddb3;
      --metal-mid: #c99a4f;
      --metal-dark: #7d5723;
      --enamel-1: #fff1f3;
      --enamel-2: #bf2d45;
      --enamel-3: #7f111f;
      --edge-shadow: rgba(48, 29, 9, 0.35);
      --stamp-text: #fff8ef;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 26px;
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 720px at 0% 0%, #fffaf1 0%, transparent 60%),
        radial-gradient(1000px 640px at 100% 100%, #efe4d2 0%, transparent 64%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
    }
    .panel {
      width: min(920px, 100%);
      border: 1px solid #baa786;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.76), rgba(255,255,255,0.56));
      box-shadow: 0 16px 34px rgba(53, 36, 17, 0.24), inset 0 1px 0 rgba(255,255,255,0.82);
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font: 600 28px/1.1 "Iowan Old Style", "Times New Roman", serif;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
    }
    .meta { display: grid; gap: 10px; font-size: 15px; }
    .label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: #7f6a50;
      margin-right: 8px;
    }

    .coin-shell {
      width: 112px;
      height: 112px;
      border-radius: 999px;
      background:
        repeating-conic-gradient(
          from 0deg,
          #a77531 0deg 4deg,
          #8d6229 4deg 8deg,
          #c28e45 8deg 12deg,
          #8d6229 12deg 16deg
        );
      box-shadow: 0 10px 16px var(--edge-shadow);
      padding: 8px;
      position: relative;
    }

    .coin-shell::before {
      content: "";
      position: absolute;
      inset: 1px;
      border-radius: 999px;
      background: linear-gradient(150deg, rgba(255,255,255,0.34), rgba(0,0,0,0.22));
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .coin-body {
      width: 100%;
      height: 100%;
      border-radius: 999px;
      border: 1px solid #7b5424;
      background:
        radial-gradient(circle at 32% 22%, var(--metal-light) 0%, var(--metal-mid) 48%, var(--metal-dark) 100%);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.35), inset 0 -5px 8px rgba(56,34,11,0.52);
      display: grid;
      place-items: center;
      position: relative;
    }

    .enamel {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      border: 1px solid rgba(255, 242, 224, 0.5);
      background:
        radial-gradient(circle at 30% 25%, var(--enamel-1) 0%, var(--enamel-2) 55%, var(--enamel-3) 100%);
      box-shadow: inset 0 1px 3px rgba(255,255,255,0.3), inset 0 -3px 5px rgba(30,8,13,0.65);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--stamp-text);
      text-shadow: 0 1px 1px rgba(20, 8, 3, 0.8);
    }

    .rank-label {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 700;
      font-size: 9px;
    }

    .rank-num {
      margin: 3px 0 0;
      font: 700 31px/1 "Iowan Old Style", "Times New Roman", serif;
    }

    .coin-caption {
      margin-top: 8px;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6f5637;
    }

    .controls {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #c6b192;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .controls label { display: flex; align-items: center; gap: 6px; }
    input, select {
      border: 1px solid #c4ab89;
      border-radius: 9px;
      background: #fff7ea;
      color: #2f2518;
      padding: 5px 8px;
      font: inherit;
    }

    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Wax Seal V4: Coin Mint Medallion</h1>

    <section class="layout">
      <div class="meta">
        <div><span class="label">Role</span>Scientist</div>
        <div><span class="label">Born</span>1564 in Pisa <span class="label" style="margin-left:12px;">Died</span>1642</div>
        <div><span class="label">Notable works</span>Dialogo, Sidereus Nuncius</div>
      </div>

      <div>
        <div class="coin-shell">
          <div class="coin-body">
            <div class="enamel">
              <p id="rankLabel" class="rank-label">Rank</p>
              <p id="rankNum" class="rank-num">#8</p>
            </div>
          </div>
        </div>
        <div class="coin-caption">Minted Consensus</div>
      </div>
    </section>

    <section class="controls">
      <label>Domain
        <select id="domain">
          <option>Science</option>
          <option>Religion</option>
          <option>Philosophy</option>
          <option>Politics</option>
          <option>Military</option>
          <option>Arts</option>
          <option>Exploration</option>
          <option>Economics</option>
          <option>Medicine</option>
        </select>
      </label>
      <label>Rank
        <input id="rank" type="number" min="1" max="5000" value="8" />
      </label>
    </section>
  </main>

  <script>
    const palettes = {
      Science: ['#f4ddb3', '#c99a4f', '#7d5723', '#edf5ff', '#4b86d4', '#1d4b8a', '#f4f9ff'],
      Religion: ['#f0dfbf', '#b28bd8', '#5f3e84', '#f7efff', '#845bc2', '#4e2f70', '#f8f0ff'],
      Philosophy: ['#f0ddc1', '#92a4e5', '#465a98', '#f4f6ff', '#6f83d4', '#3c4d88', '#f1f4ff'],
      Politics: ['#f4ddb3', '#c99a4f', '#7d5723', '#fff1f3', '#bf2d45', '#7f111f', '#fff8ef'],
      Military: ['#f4ddb3', '#c99a4f', '#7d5723', '#fff4ea', '#cc7b34', '#8a3e17', '#fff7ef'],
      Arts: ['#f4ddb3', '#c99a4f', '#7d5723', '#ebfff8', '#37ad89', '#17664f', '#effff8'],
      Exploration: ['#f4ddb3', '#c99a4f', '#7d5723', '#ebfbff', '#3ca9bb', '#1c5f67', '#edfcff'],
      Economics: ['#f4ddb3', '#c99a4f', '#7d5723', '#fff8e9', '#cf9230', '#7a4b10', '#fff9ef'],
      Medicine: ['#f4ddb3', '#c99a4f', '#7d5723', '#fff1f8', '#c85a9b', '#7a1f57', '#fff5fb']
    };

    const root = document.documentElement;
    const rankInput = document.getElementById('rank');
    const domainInput = document.getElementById('domain');
    const rankLabel = document.getElementById('rankLabel');
    const rankNum = document.getElementById('rankNum');

    function setDomain(name) {
      const p = palettes[name] || palettes.Politics;
      root.style.setProperty('--metal-light', p[0]);
      root.style.setProperty('--metal-mid', p[1]);
      root.style.setProperty('--metal-dark', p[2]);
      root.style.setProperty('--enamel-1', p[3]);
      root.style.setProperty('--enamel-2', p[4]);
      root.style.setProperty('--enamel-3', p[5]);
      root.style.setProperty('--stamp-text', p[6]);
    }

    function setRank(v) {
      const n = Math.max(1, Math.floor(Number(v) || 1));
      const d = String(n).length;
      rankNum.textContent = `#${n}`;
      rankLabel.style.fontSize = d <= 2 ? '9px' : d === 3 ? '8px' : '7px';
      rankNum.style.fontSize = d <= 2 ? '31px' : d === 3 ? '26px' : '20px';
    }

    domainInput.addEventListener('change', () => setDomain(domainInput.value));
    rankInput.addEventListener('input', () => setRank(rankInput.value));

    setDomain(domainInput.value);
    setRank(rankInput.value);
  </script>
</body>
</html>
