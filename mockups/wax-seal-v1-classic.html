<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wax Seal Mockup V1 - Classic</title>
  <style>
    :root {
      --bg-a: #f5efe4;
      --bg-b: #eadcc7;
      --text: #2f2417;
      --line: #bca88a;
      --wax-border: #7f111f;
      --wax-highlight: #ffc4cb;
      --wax-outer: #bf2d45;
      --wax-mid: #941b30;
      --wax-inner: #641221;
      --wax-ring: rgba(255, 221, 227, 0.34);
      --wax-text: #fff2f4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(1300px 700px at 0% 0%, #fffaf0 0%, transparent 58%),
        radial-gradient(1200px 760px at 100% 100%, #f0dfbf 0%, transparent 62%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b));
      display: grid;
      place-items: center;
      padding: 28px;
    }

    .frame {
      width: min(920px, 100%);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.55));
      box-shadow: 0 18px 40px rgba(58, 37, 12, 0.22), inset 0 1px 0 rgba(255,255,255,0.75);
      padding: 24px 26px;
    }

    .head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 18px;
    }

    .head h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Times New Roman", serif;
      font-size: 28px;
      letter-spacing: 0.01em;
    }

    .chip {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: #7d6548;
      border: 1px solid #c9b293;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255, 249, 238, 0.9);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: start;
    }

    .meta {
      display: flex;
      flex-direction: column;
      gap: 9px;
      font-size: 15px;
    }

    .meta .label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: #8b7459;
      margin-right: 8px;
    }

    .works {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #cdb292;
      background: #fff8ec;
      font-size: 12px;
    }

    .wax {
      width: 108px;
      height: 108px;
      border-radius: 999px;
      border: 1px solid var(--wax-border);
      background: radial-gradient(circle at 28% 24%, var(--wax-highlight) 0%, var(--wax-outer) 34%, var(--wax-mid) 66%, var(--wax-inner) 100%);
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.3),
        inset 0 -4px 6px rgba(32,7,12,0.62),
        0 9px 13px rgba(48, 11, 16, 0.3);
      position: relative;
    }

    .wax::before {
      content: "";
      position: absolute;
      inset: 4px;
      border-radius: 999px;
      border: 1px solid var(--wax-ring);
      background: repeating-conic-gradient(
        from 0deg,
        rgba(255,255,255,0.12) 0deg 10deg,
        rgba(0,0,0,0.08) 10deg 20deg
      );
    }

    .wax-inner {
      position: absolute;
      inset: 11px;
      border-radius: 999px;
      border: 1px solid var(--wax-ring);
      background: radial-gradient(circle at 30% 25%, var(--wax-highlight) 0%, var(--wax-mid) 58%, var(--wax-inner) 100%);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.22), inset 0 -2px 4px rgba(20,4,8,0.56);
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--wax-text);
    }

    .rank-label {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-weight: 700;
      font-size: 9px;
      opacity: 0.95;
    }

    .rank-num {
      margin: 4px 0 0;
      font-family: "Iowan Old Style", "Times New Roman", serif;
      font-size: 31px;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(34, 6, 11, 0.75);
      font-weight: 700;
    }

    .controls {
      margin-top: 18px;
      border-top: 1px dashed #cdb89b;
      padding-top: 14px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      font-size: 13px;
    }

    .controls label {
      display: flex;
      gap: 6px;
      align-items: center;
      color: #5d4b36;
    }

    select, input {
      border: 1px solid #c5ad8c;
      border-radius: 9px;
      background: #fff7ea;
      color: #2e2418;
      padding: 5px 8px;
      font: inherit;
    }

    @media (max-width: 680px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .wax-wrap {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <div class="head">
      <h1>Wax Seal V1: Classic Circular</h1>
      <span class="chip">Mockup 1 of 3</span>
    </div>

    <section class="layout">
      <div class="meta">
        <div><span class="label">Role</span>Physician</div>
        <div><span class="label">Born</span>460 BCE in Kos  <span class="label" style="margin-left:12px;">Died</span>370 BCE</div>
        <div><span class="label">Notable works</span></div>
        <div class="works">
          <span class="pill">On the Sacred Disease</span>
          <span class="pill">Aphorisms</span>
          <span class="pill">Prognostic</span>
        </div>
      </div>

      <div class="wax-wrap">
        <div class="wax" id="wax">
          <div class="wax-inner">
            <p class="rank-label" id="rankLabel">Rank</p>
            <p class="rank-num" id="rankNum">#12</p>
          </div>
        </div>
      </div>
    </section>

    <section class="controls">
      <label>Domain
        <select id="domain">
          <option>Science</option>
          <option>Religion</option>
          <option>Philosophy</option>
          <option>Politics</option>
          <option>Military</option>
          <option>Arts</option>
          <option>Exploration</option>
          <option>Economics</option>
          <option>Medicine</option>
        </select>
      </label>
      <label>Rank
        <input id="rank" type="number" min="1" max="5000" value="12" />
      </label>
    </section>
  </main>

  <script>
    const palettes = {
      Science: ['#234b88', '#9dc4ff', '#5f95e3', '#3d6fbe', '#294b86', 'rgba(214,232,255,0.38)', '#eef5ff'],
      Religion: ['#5f3e84', '#d6b4ff', '#9a72cc', '#7654aa', '#523875', 'rgba(244,223,255,0.34)', '#f8efff'],
      Philosophy: ['#3f4e92', '#b7c6ff', '#6b7dd8', '#4f60b5', '#35407f', 'rgba(226,233,255,0.34)', '#f2f6ff'],
      Politics: ['#7f111f', '#ffc3cc', '#be2a43', '#931a2f', '#641220', 'rgba(255,220,225,0.32)', '#fff1f3'],
      Military: ['#7f3e13', '#ffd1ad', '#cf6b29', '#a14d1f', '#6f3313', 'rgba(255,224,197,0.32)', '#fff3e8'],
      Arts: ['#17664f', '#b6f6de', '#33ab86', '#248366', '#195d48', 'rgba(215,255,241,0.3)', '#ebfff8'],
      Exploration: ['#1c5f67', '#b8eef7', '#3ca9bb', '#2f8390', '#1f5f68', 'rgba(214,247,255,0.3)', '#ebfbff'],
      Economics: ['#7a4b10', '#ffe1a7', '#cf9230', '#9f6f22', '#704d18', 'rgba(255,236,202,0.32)', '#fff8e8'],
      Medicine: ['#7a1f57', '#ffd0ec', '#c85a9b', '#9a3f77', '#6d2c56', 'rgba(255,225,244,0.34)', '#fff1f8'],
    };

    const els = {
      wax: document.getElementById('wax'),
      rankLabel: document.getElementById('rankLabel'),
      rankNum: document.getElementById('rankNum'),
      rank: document.getElementById('rank'),
      domain: document.getElementById('domain'),
    };

    function applyDomain(name) {
      const p = palettes[name] || palettes.Politics;
      document.documentElement.style.setProperty('--wax-border', p[0]);
      document.documentElement.style.setProperty('--wax-highlight', p[1]);
      document.documentElement.style.setProperty('--wax-outer', p[2]);
      document.documentElement.style.setProperty('--wax-mid', p[3]);
      document.documentElement.style.setProperty('--wax-inner', p[4]);
      document.documentElement.style.setProperty('--wax-ring', p[5]);
      document.documentElement.style.setProperty('--wax-text', p[6]);
    }

    function applyRank(value) {
      const n = Math.max(1, Math.floor(Number(value) || 1));
      const digits = String(n).length;
      els.rankNum.textContent = `#${n}`;
      els.rankLabel.style.fontSize = digits <= 2 ? '9px' : digits === 3 ? '8px' : '7px';
      els.rankNum.style.fontSize = digits <= 2 ? '32px' : digits === 3 ? '27px' : '21px';
    }

    els.domain.addEventListener('change', () => applyDomain(els.domain.value));
    els.rank.addEventListener('input', () => applyRank(els.rank.value));

    applyDomain(els.domain.value);
    applyRank(els.rank.value);
  </script>
</body>
</html>
