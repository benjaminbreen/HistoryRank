<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wax Seal Mockup V2 - Heraldic Crest</title>
  <style>
    :root {
      --paper: #efe6d3;
      --ink: #2f2418;
      --wax-border: #7f111f;
      --wax-highlight: #ffc3cc;
      --wax-outer: #bc2941;
      --wax-mid: #8f182c;
      --wax-inner: #5d101d;
      --wax-ring: rgba(255, 223, 228, 0.34);
      --wax-text: #fff2f4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.35), transparent 55%),
        radial-gradient(1400px 900px at 100% 0%, #f5eddc 0%, transparent 66%),
        linear-gradient(145deg, #e8dbc3, #d8c29f);
    }
    .sheet {
      width: min(940px, 100%);
      border-radius: 20px;
      border: 1px solid #b29b79;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.74), rgba(255,255,255,0.57)),
        repeating-linear-gradient(0deg, rgba(120,95,65,0.05) 0 1px, transparent 1px 5px);
      box-shadow: 0 16px 34px rgba(47, 31, 14, 0.2), inset 0 1px 0 rgba(255,255,255,0.8);
      padding: 22px 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-family: "Iowan Old Style", "Times New Roman", serif;
      font-size: 28px;
      font-weight: 600;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 22px;
      align-items: start;
    }
    .meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 15px;
      max-width: 560px;
    }
    .label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 11px;
      color: #78634b;
      margin-right: 8px;
    }
    .seal-wrap {
      display: grid;
      gap: 10px;
      justify-items: center;
    }
    .seal {
      width: 104px;
      height: 104px;
      border-radius: 999px;
      border: 1px solid var(--wax-border);
      background: radial-gradient(circle at 28% 24%, var(--wax-highlight), var(--wax-outer) 34%, var(--wax-mid) 68%, var(--wax-inner));
      box-shadow:
        inset 0 2px 3px rgba(255,255,255,0.33),
        inset 0 -4px 6px rgba(31,7,11,0.65),
        0 8px 13px rgba(44, 10, 14, 0.34);
      position: relative;
    }
    .seal::before {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 999px;
      border: 1px solid var(--wax-ring);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.2);
      background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.11) 0deg 8deg, rgba(0,0,0,0.09) 8deg 16deg);
    }
    .seal-inner {
      position: absolute;
      inset: 13px;
      border-radius: 999px;
      border: 1px solid var(--wax-ring);
      background: radial-gradient(circle at 30% 26%, var(--wax-highlight), var(--wax-mid) 62%, var(--wax-inner));
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--wax-text);
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.22), inset 0 -2px 4px rgba(19,4,8,0.58);
    }
    .crest {
      font-size: 10px;
      line-height: 1;
      opacity: 0.85;
      margin-bottom: 2px;
      letter-spacing: 0.03em;
    }
    .rank-label {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.19em;
      font-size: 9px;
      font-weight: 700;
    }
    .rank-num {
      margin: 4px 0 0;
      font-family: "Iowan Old Style", "Times New Roman", serif;
      font-size: 30px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 1px rgba(30, 6, 11, 0.75);
    }
    .seal-cap {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #7b654b;
      border: 1px solid #c7af8f;
      border-radius: 999px;
      padding: 4px 8px;
      background: rgba(255,248,236,0.92);
    }
    .controls {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #c7b18f;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #594833;
    }
    .controls label { display: flex; gap: 6px; align-items: center; }
    input, select {
      border: 1px solid #c6ad8b;
      border-radius: 9px;
      background: #fff8eb;
      color: #2e2518;
      padding: 5px 8px;
      font: inherit;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>Wax Seal V2: Heraldic Crest</h1>
    <section class="layout">
      <div class="meta">
        <div><span class="label">Role</span>Physicist</div>
        <div><span class="label">Born</span>1879 CE in Ulm  <span class="label" style="margin-left:12px;">Died</span>1955 CE</div>
        <div><span class="label">Notable works</span>Special relativity, General relativity, Photoelectric effect</div>
      </div>
      <div class="seal-wrap">
        <div class="seal" id="seal">
          <div class="seal-inner">
            <div class="crest">H R</div>
            <p class="rank-label" id="rankLabel">Rank</p>
            <p class="rank-num" id="rankNum">#8</p>
          </div>
        </div>
        <div class="seal-cap">Historical Ranking</div>
      </div>
    </section>
    <section class="controls">
      <label>Domain
        <select id="domain">
          <option>Science</option>
          <option>Religion</option>
          <option>Philosophy</option>
          <option>Politics</option>
          <option>Military</option>
          <option>Arts</option>
          <option>Exploration</option>
          <option>Economics</option>
          <option>Medicine</option>
        </select>
      </label>
      <label>Rank
        <input id="rank" type="number" min="1" max="5000" value="8" />
      </label>
    </section>
  </main>
  <script>
    const palettes = {
      Science: ['#234b88', '#9dc4ff', '#5f95e3', '#3d6fbe', '#294b86', 'rgba(214,232,255,0.38)', '#eef5ff'],
      Religion: ['#5f3e84', '#d6b4ff', '#9a72cc', '#7654aa', '#523875', 'rgba(244,223,255,0.34)', '#f8efff'],
      Philosophy: ['#3f4e92', '#b7c6ff', '#6b7dd8', '#4f60b5', '#35407f', 'rgba(226,233,255,0.34)', '#f2f6ff'],
      Politics: ['#7f111f', '#ffc3cc', '#be2a43', '#931a2f', '#641220', 'rgba(255,220,225,0.32)', '#fff1f3'],
      Military: ['#7f3e13', '#ffd1ad', '#cf6b29', '#a14d1f', '#6f3313', 'rgba(255,224,197,0.32)', '#fff3e8'],
      Arts: ['#17664f', '#b6f6de', '#33ab86', '#248366', '#195d48', 'rgba(215,255,241,0.3)', '#ebfff8'],
      Exploration: ['#1c5f67', '#b8eef7', '#3ca9bb', '#2f8390', '#1f5f68', 'rgba(214,247,255,0.3)', '#ebfbff'],
      Economics: ['#7a4b10', '#ffe1a7', '#cf9230', '#9f6f22', '#704d18', 'rgba(255,236,202,0.32)', '#fff8e8'],
      Medicine: ['#7a1f57', '#ffd0ec', '#c85a9b', '#9a3f77', '#6d2c56', 'rgba(255,225,244,0.34)', '#fff1f8'],
    };
    const root = document.documentElement;
    const rank = document.getElementById('rank');
    const domain = document.getElementById('domain');
    const rankLabel = document.getElementById('rankLabel');
    const rankNum = document.getElementById('rankNum');

    function setDomain(name) {
      const p = palettes[name] || palettes.Politics;
      root.style.setProperty('--wax-border', p[0]);
      root.style.setProperty('--wax-highlight', p[1]);
      root.style.setProperty('--wax-outer', p[2]);
      root.style.setProperty('--wax-mid', p[3]);
      root.style.setProperty('--wax-inner', p[4]);
      root.style.setProperty('--wax-ring', p[5]);
      root.style.setProperty('--wax-text', p[6]);
    }

    function setRank(v) {
      const n = Math.max(1, Math.floor(Number(v) || 1));
      const d = String(n).length;
      rankNum.textContent = `#${n}`;
      rankLabel.style.fontSize = d <= 2 ? '9px' : d === 3 ? '8px' : '7px';
      rankNum.style.fontSize = d <= 2 ? '31px' : d === 3 ? '26px' : '20px';
    }

    domain.addEventListener('change', () => setDomain(domain.value));
    rank.addEventListener('input', () => setRank(rank.value));

    setDomain(domain.value);
    setRank(rank.value);
  </script>
</body>
</html>
